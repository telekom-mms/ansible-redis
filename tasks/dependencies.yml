---
- name: Install debian dependencies
  when: ansible_facts['os_family'] == "Debian"
  ansible.builtin.apt:
    name:
      - gcc
      - make
      - libc6-dev
    update_cache: true
    cache_valid_time: 86400
    state: present

- name: Install debian TLS build dependencies
  when:
    - ansible_facts['os_family'] == "Debian"
    - redis_make_tls | bool
  ansible.builtin.apt:
    name:
      - libssl-dev
    state: present

- name: Install redhat dependencies
  when: ansible_facts['os_family'] == "RedHat"
  ansible.builtin.dnf:
    name:
      - gcc
      - gcc-c++
      - make
    state: present

- name: Install redhat TLS build dependencies
  when:
    - ansible_facts['os_family'] == "RedHat"
    - redis_make_tls | bool
  ansible.builtin.dnf:
    name:
      - openssl-devel
    state: present

- name: Install suse dependencies
  when: ansible_facts['os_family'] == 'Suse'
  community.general.zypper:
    name:
      - gcc
      - gcc-c++
      - make
    state: present

- name: Install suse TLS build dependencies
  when:
    - ansible_facts['os_family'] == 'Suse'
    - redis_make_tls | bool
  community.general.zypper:
    name:
      - libopenssl-devel
    state: present
