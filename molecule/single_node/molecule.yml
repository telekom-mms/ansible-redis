---
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: redis
    image: ${MOLECULE_IMAGE:-geerlingguy/docker-debian12-ansible:latest}
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    pre_build_image: true
    command: ""
provisioner:
  name: ansible
verifier:
  name: ansible
