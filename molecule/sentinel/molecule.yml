---
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: redis-primary
    image: ${MOLECULE_IMAGE:-geerlingguy/docker-debian12-ansible:latest}
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    pre_build_image: true
    command: ""
    docker_networks:
      - name: redis-sentinel
    networks:
      - name: redis-sentinel
        aliases:
          - redis-primary
  - name: redis-sentinel-1
    image: ${MOLECULE_IMAGE:-geerlingguy/docker-debian12-ansible:latest}
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    pre_build_image: true
    command: ""
    networks:
      - name: redis-sentinel
        aliases:
          - redis-sentinel-1
  - name: redis-sentinel-2
    image: ${MOLECULE_IMAGE:-geerlingguy/docker-debian12-ansible:latest}
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    pre_build_image: true
    command: ""
    networks:
      - name: redis-sentinel
        aliases:
          - redis-sentinel-2
provisioner:
  name: ansible
verifier:
  name: ansible
