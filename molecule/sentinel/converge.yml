---
- name: Converge
  hosts: all
  vars:
    redis_version: "{{ lookup('env', 'REDIS_VERSION') | default('7.2.17', true) }}"
    redis_make_tls: "{{ lookup('env', 'REDIS_MAKE_TLS') | default('false', true) | bool }}"
    redis_bind: "0.0.0.0"
    redis_config_additional: |
      protected-mode no
    redis_server: "{{ inventory_hostname == 'redis-primary' }}"
    redis_sentinel: "{{ inventory_hostname != 'redis-primary' }}"
    redis_sentinel_monitors:
      - name: primary01
        host: redis-primary
        port: 6379
        quorum: 2
        down_after_milliseconds: 10000
    redis_inside_container: true
    redis_sentinel_config_additional: |
      sentinel resolve-hostnames yes
      sentinel announce-hostnames yes
  tasks:
    - name: Apply Redis role
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
