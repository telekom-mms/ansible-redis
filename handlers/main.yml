---
- name: "Restart redis {{ redis_port }}"
  when: redis_as_service
  ansible.builtin.service:
    name: "{{ redis_service_name }}"
    state: restarted

- name: "Restart sentinel {{ redis_sentinel_port }}"
  when: redis_as_service
  ansible.builtin.service:
    name: sentinel_{{ redis_sentinel_port }}
    state: restarted
